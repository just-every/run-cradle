name: Verify
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      tier:
        type: string
        default: push
      timeout:
        type: number
        default: 12
permissions:
  contents: read
concurrency:
  group: seed-verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  WRANGLER_SEND_METRICS: 'false'
  PLAYWRIGHT_SKIP_BROWSER_GC: '1'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - id: plan
        env:
          TIER: ${{ inputs.tier || 'push' }}
        run: echo "matrix=$(node scripts/verify-ci.mjs --matrix "$TIER")" >> "$GITHUB_OUTPUT"
      - run: npm install --global pnpm@10.12.4
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.local/share/pnpm/store
          key: seed-ubuntu24-${{ runner.arch }}-browser-false-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Build, types and managed specification
        run: node scripts/verify-app.mjs build
      - name: Pack production build
        run: tar -czf /tmp/cradle-build.tgz dist
      - uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: /tmp/cradle-build.tgz
          retention-days: 1
  shards:
    name: verify-${{ matrix.name }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout || 12 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - name: Cache frozen dependencies and Chromium
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/.cache/ms-playwright
          key: seed-ubuntu24-${{ runner.arch }}-browser-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Install Chromium system libraries
        if: matrix.browser
        run: |
          # Verify 39857704532 spent 9m30s of verify-launch-doors' 12-minute cap
          # in one apt-get download from the runner's Azure mirror, with the
          # journeys never reaching their end. A stalled mirror path does not
          # recover on the same host, so attempt 1 uses the Azure mirror and
          # attempts 2 and 3 use other mirrors serving the same Ubuntu-signed
          # archive (apt still verifies every Release signature). Keep the
          # mirror list in step with Base's verify.yml (runeditrun/base).
          mirrors=(http://azure.archive.ubuntu.com/ubuntu http://mirrors.edge.kernel.org/ubuntu http://us-east-1.ec2.archive.ubuntu.com/ubuntu)
          # Keep downloaded archives, including partial ones, across attempts.
          sudo mkdir -p /var/tmp/cradle-apt/archives
          cat <<'APT' | sudo tee /var/tmp/cradle-apt/apt.conf > /dev/null
          Dir::Cache::archives "/var/tmp/cradle-apt/archives";
          APT::Keep-Downloaded-Packages "true";
          APT::Update::Error-Mode "any";
          Acquire::Retries "2";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APT
          started=$SECONDS
          for attempt in 1 2 3; do
            mirror=${mirrors[attempt - 1]}
            # Hosted Ubuntu now uses mirror+file:/etc/apt/apt-mirrors.txt.
            # Rewrite the Ubuntu source's URI itself so apt cannot keep selecting
            # Azure through that indirection. Suites and signature checks stay intact.
            sudo sed -i -E "s@^(URIs:[[:space:]]*).*@\1${mirror}/@" /etc/apt/sources.list.d/ubuntu.sources
            printf 'Chromium apt: libraries attempt %s/3 (60s deadline; mirror %s)\n' "$attempt" "$mirror"
            if sudo env "PATH=$PATH" APT_CONFIG=/var/tmp/cradle-apt/apt.conf timeout --kill-after=5s 60s bash -ec '
              dpkg --configure -a
              ./node_modules/.bin/playwright install-deps chromium
            '; then
              printf 'Chromium apt: libraries complete (attempts=%s mirror=%s seconds=%s)\n' "$attempt" "$mirror" "$((SECONDS - started))"
              exit 0
            else
              status=$?
              printf 'Chromium apt: libraries attempt %s/3 failed (mirror %s, exit %s, seconds=%s)\n' "$attempt" "$mirror" "$status" "$((SECONDS - started))" >&2
            fi
            if (( attempt < 3 )); then sleep "$((attempt * 2))"; fi
          done
          printf 'Chromium apt: libraries failed after 3 attempts (exit %s; 60s per attempt; seconds=%s). Inspect the apt download log.\n' "$status" "$((SECONDS - started))" >&2
          exit 1
      - name: Install Chromium
        if: matrix.browser
        run: pnpm exec playwright install chromium
      - name: Reserve disk for native runtime journeys
        run: |
          free_kib() { df -Pk "$GITHUB_WORKSPACE" | awk 'END { print $4 }'; }
          for unused_tools in /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL; do
            if [ "$(free_kib)" -ge "$((20 * 1024 * 1024))" ]; then break; fi
            sudo rm -rf -- "$unused_tools"
          done
      - uses: actions/download-artifact@v4
        with:
          name: production-build
          path: /tmp/cradle-build
      - name: Restore production build
        run: tar -xzf /tmp/cradle-build/cradle-build.tgz
      - name: Run this shard
        env:
          SHARD: ${{ matrix.name }}
        run: node scripts/verify-ci.mjs "$SHARD"
  verify:
    needs: [build, shards]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every verification worker
        env:
          BUILD: ${{ needs.build.result }}
          SHARDS: ${{ needs.shards.result }}
        run: test "$BUILD" = success && test "$SHARDS" = success
